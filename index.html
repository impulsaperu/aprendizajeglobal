<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprendizaje Global | Biblioteca Digital</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerRow = 3, itemsPerPage = 8, itemGaps = '15px', filter = false, paginationPos = 'center', sort = 2;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 20px 10px 90px 10px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* CONTENEDOR Y MARCA APRENDIZAJEGLOBAL AJUSTADA PARA MÓVIL */
    .fliplink-container {
      width: 100%;
      display: block;
      text-align: center;
      position: relative;
    }

    /* Ajustar el título de la carpeta que genera FlipLink para que no se desborde */
    .fliplink-container .fliplink-folder-title,
    .fliplink-container h2,
    .fliplink-container [class*="folder-title"] {
      display: block !important;
      visibility: visible !important;
      font-size: 1.3rem !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      color: #222 !important;
      margin: 10px 0 20px 0 !important;
      word-wrap: break-word !important;
      white-space: normal !important;
      text-align: center !important;
      width: 100% !important;
    }

    /* Ocultar únicamente el buscador de FlipLink */
    .fliplink-search-box,
    .fliplink-container input[type="text"] {
      display: none !important;
    }

    /* MOSTRAR TÍTULOS DE CADA LIBRO BAJO LAS PORTADAS */
    .fliplink-container .fliplink-item-title,
    .fliplink-container [class*="item-title"],
    .fliplink-container [class*="title-text"],
    .fliplink-container p,
    .fliplink-container span {
      display: block !important;
      visibility: visible !important;
      text-align: center !important;
      font-weight: 600 !important;
      color: #333 !important;
      margin-top: 8px !important;
      font-size: 0.85rem !important;
    }

    /* VISTA DE TARJETAS EN CELULAR (PORTADAS GRANDES) */
    @media (max-width: 768px) {
      body {
        padding: 12px 6px 80px 6px;
      }
      .fliplink-container [class*="item"] {
        width: 46% !important;
        min-width: 140px !important;
        margin: 6px 1.5% 15px 1.5% !important;
        display: inline-block !important;
        vertical-align: top !important;
      }
    }

    @media (max-width: 400px) {
      .fliplink-container [class*="item"] {
        width: 88% !important;
        max-width: 280px !important;
        margin: 10px auto 20px auto !important;
        display: block !important;
      }
    }

    /* LECTOR A PANTALLA COMPLETA TOTAL EN MÓVILES AL ABRIR CUALQUIER LIBRO */
    .hip-modal, .hip-modal-content {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 999999 !important;
      background: #000 !important;
    }

    iframe[name="hip-iframe"],
    .hip-modal iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Galería con la carpeta biblioteca de FlipLink -->
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

</body>
</html>
