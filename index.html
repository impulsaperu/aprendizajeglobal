<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biblioteca Digital | Aprendizaje Global</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerPage = 8, itemsPerRow = 3, itemGaps = '15px', filter = false, paginationPos = 'center', sort = 1;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden; /* Evita que la pantalla se desplace a los lados */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 20px 10px 100px 10px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* TÍTULO PRINCIPAL LIMPIO */
    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #222;
      margin-bottom: 20px;
    }

    /* OCULTAR TODOS LOS ENCABEZADOS Y BÚSQUEDAS DE FLIPLINK */
    .fliplink-container *, 
    .fliplink-folder-title, 
    .fliplink-search-box, 
    div[class*="title"], 
    h1, h2, h3, h4 {
      max-width: 100%;
    }
    
    .fliplink-container > div:first-child:not(.fliplink-items-container),
    .fliplink-folder-title,
    .fliplink-search-box {
      display: none !important;
    }

    .fliplink-container {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    /* VISTA MÓVIL */
    @media (max-width: 768px) {
      body {
        padding: 15px 8px 90px 8px;
      }
      .main-title {
        font-size: 1.3rem;
        margin-bottom: 15px;
      }
    }

    /* MODAL A PANTALLA COMPLETA */
    .hip-modal, .hip-modal-content, iframe[name="hip-iframe"] {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 99999 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="main-title">Biblioteca Digital</h1>

    <!-- Galería de FlipLinks -->
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

  <script id="42vw6iznk9" src="https://widget.chatmaxima.com/embed.min.js" defer></script>

</body>
</html>
