<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biblioteca Digital | Aprendizaje Global</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerRow = 3, itemsPerPage = 8, itemGaps = '20px', filter = false, paginationPos = 'center', sort = 2;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 25px 15px 100px 15px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* TÍTULO PRINCIPAL DE LA WEB */
    .main-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #222;
      margin-bottom: 25px;
      letter-spacing: -0.5px;
    }

    /* OCULTAR ÚNICAMENTE EL ENCABEZADO/TITULO SUPERIOR DE LA CARPETA DE FLIPLINK */
    .fliplink-folder-title,
    .fliplink-search-box,
    .fliplink-container > div > h1,
    .fliplink-container > div > h2 {
      display: none !important;
    }

    .fliplink-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* ASEGURAR QUE LOS TÍTULOS DE CADA LIBRO SÍ SE VEAN */
    .fliplink-item-title,
    .fliplink-container [class*="item-title"],
    .fliplink-container p,
    .fliplink-container span {
      display: block !important;
      visibility: visible !important;
      text-align: center !important;
      font-weight: 600 !important;
      color: #333 !important;
      margin-top: 8px !important;
      font-size: 0.9rem !important;
    }

    /* VISTA MÓVIL (MÁXIMO 2 COLUMNAS GRANDES) */
    @media (max-width: 768px) {
      body {
        padding: 15px 10px 90px 10px;
      }
      .main-title {
        font-size: 1.4rem;
        margin-bottom: 15px;
      }
      /* Ajusta el tamaño de las tarjetas en móviles */
      .fliplink-container .fliplink-item,
      .fliplink-container [class*="item"] {
        width: 45% !important;
        min-width: 140px !important;
        margin: 8px !important;
        display: inline-block !important;
      }
    }

    @media (max-width: 480px) {
      .fliplink-container .fliplink-item,
      .fliplink-container [class*="item"] {
        width: 85% !important;
        max-width: 280px !important;
        margin: 15px auto !important;
      }
    }

    /* MODAL A PANTALLA COMPLETA AL ABRIR CADA LIBRO */
    .hip-modal, .hip-modal-content, iframe[name="hip-iframe"] {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 99999 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="main-title">Biblioteca Digital</h1>

    <!-- Galería de FlipLinks -->
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

  <!-- Widget de ChatMaxima -->
  <script>
    window.chatmaximaConfig = { token: '42vw6iznk9' };
  </script>
  <script id="42vw6iznk9" src="https://widget.chatmaxima.com/embed.min.js" defer></script>

</body>
</html>
