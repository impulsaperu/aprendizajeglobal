<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprendizaje Global | Biblioteca Digital</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerRow = 3, itemsPerPage = 8, itemGaps = '20px', filter = false, paginationPos = 'center', sort = 2;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 20px 10px 100px 10px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* TÍTULO DE MARCA DE FLIPLINK EN MÓVIL */
    .fliplink-container {
      width: 100%;
      text-align: center;
    }

    .fliplink-container .fliplink-folder-title,
    .fliplink-container h2 {
      display: block !important;
      font-size: 1.4rem !important;
      font-weight: 800 !important;
      color: #222 !important;
      margin: 10px 0 20px 0 !important;
      text-align: center !important;
      width: 100% !important;
      letter-spacing: -0.3px !important;
    }

    /* OCULTAR BUSCADOR */
    .fliplink-search-box,
    .fliplink-container input[type="text"] {
      display: none !important;
    }

    /* REGLA MAESTRA PARA MÓVILES (ROMPER EL LAYOUT DE 3 COLUMNAS DE FLIPLINK) */
    @media (max-width: 768px) {
      /* Obliga al contenedor interno a usar Flexbox envolvente */
      .fliplink-container > div,
      .fliplink-items-container {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
        width: 100% !important;
        gap: 15px !important;
      }

      /* Cada tarjeta ocupa el 45% en pantallas medianas o tabletas */
      .fliplink-container [class*="item"],
      div[class*="fliplink-item"] {
        width: 45% !important;
        max-width: 45% !important;
        min-width: 140px !important;
        margin: 0 0 15px 0 !important;
        float: none !important;
        display: block !important;
      }
    }

    @media (max-width: 480px) {
      /* En smartphones estándar (como el de la foto): 1 COLUMNA GRANDE */
      .fliplink-container [class*="item"],
      div[class*="fliplink-item"] {
        width: 85% !important;
        max-width: 280px !important;
        margin: 0 auto 20px auto !important;
      }
    }

    /* ASEGURAR QUE CADA PORTADA TENGA SU IMAGEN Y TEXTO CENTRADOS */
    .fliplink-container [class*="item"] img {
      width: 100% !important;
      height: auto !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12) !important;
    }

    .fliplink-container [class*="title"],
    .fliplink-container p,
    .fliplink-container span {
      display: block !important;
      visibility: visible !important;
      text-align: center !important;
      font-weight: 600 !important;
      color: #333 !important;
      margin-top: 8px !important;
      font-size: 0.9rem !important;
    }

    /* MODAL FULLSCREEN COMPLETO AL ABRIR UN LIBRO */
    .hip-modal, .hip-modal-content {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 999999 !important;
      background: #000 !important;
    }

    iframe[name="hip-iframe"],
    .hip-modal iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

</body>
</html>
