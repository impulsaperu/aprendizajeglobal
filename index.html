<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprendizaje Global | Biblioteca Digital</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerRow = 3, itemsPerPage = 8, itemGaps = '20px', filter = false, paginationPos = 'center', sort = 2;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 25px 15px 100px 15px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* CONTENEDOR Y TÍTULO DE MARCA */
    .fliplink-container {
      width: 100%;
      text-align: center;
      position: relative;
    }

    .fliplink-container .fliplink-folder-title,
    .fliplink-container h2 {
      display: block !important;
      font-size: 1.5rem !important;
      font-weight: 800 !important;
      color: #222 !important;
      margin: 10px 0 25px 0 !important;
      text-align: center !important;
      width: 100% !important;
    }

    /* OCULTAR BUSCADOR */
    .fliplink-search-box,
    .fliplink-container input[type="text"] {
      display: none !important;
    }

    /* TÍTULOS DE CADA LIBRO VISIBLES DEBAJO DE LA PORTADA */
    .fliplink-container .fliplink-item-title,
    .fliplink-container [class*="title"],
    .fliplink-container p,
    .fliplink-container span {
      display: block !important;
      visibility: visible !important;
      text-align: center !important;
      font-weight: 600 !important;
      color: #333 !important;
      margin-top: 8px !important;
      font-size: 0.88rem !important;
      word-break: break-word !important;
    }

    /* VISTA EN MÓVILES: FORZAR TARJETAS GRANDES EN 2 COLUMNAS O 1 COLUMNA */
    @media (max-width: 768px) {
      body {
        padding: 15px 8px 90px 8px;
      }
      .fliplink-container .fliplink-item,
      .fliplink-container [class*="item"] {
        width: 44% !important;
        max-width: 44% !important;
        min-width: 140px !important;
        margin: 8px 2% 18px 2% !important;
        display: inline-block !important;
        vertical-align: top !important;
      }
      .fliplink-container [class*="item"] img {
        width: 100% !important;
        height: auto !important;
      }
    }

    @media (max-width: 420px) {
      .fliplink-container .fliplink-item,
      .fliplink-container [class*="item"] {
        width: 85% !important;
        max-width: 270px !important;
        margin: 10px auto 20px auto !important;
        display: block !important;
      }
    }

    /* LECTOR A PANTALLA COMPLETA TOTAL EN CELULAR Y PC */
    .hip-modal, .hip-modal-content {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 999999 !important;
      background: #000 !important;
    }

    iframe[name="hip-iframe"],
    .hip-modal iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

</body>
</html>
