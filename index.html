<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biblioteca Digital | Aprendizaje Global</title>

  <!-- Scripts de FlipLink -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://go.fliplink.me/content/assets/js/embed.js?v=5.0"></script>
  <script src="https://go.fliplink.me/content/assets/js/hip.js?v=5.0"></script>
  <script>
    var itemsPerPage = 8, itemsPerRow = 3, itemGaps = '15px', filter = false, paginationPos = 'center', sort = 1;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }
    body {
      padding: 20px 10px 100px 10px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* TÍTULO PRINCIPAL */
    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #222;
      margin-bottom: 20px;
    }

    /* OCULTAR DE RAÍZ CUALQUIER TEXTO O TÍTULO DE FLIPLINK */
    .fliplink-container h1,
    .fliplink-container h2,
    .fliplink-container h3,
    .fliplink-container .fliplink-folder-title,
    .fliplink-container .fliplink-search-box,
    .fliplink-container [class*="title"],
    .fliplink-container [class*="header"] {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    .fliplink-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* MODAL FULLSCREEN */
    .hip-modal, .hip-modal-content, iframe[name="hip-iframe"] {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      z-index: 99999 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="main-title">Biblioteca Digital</h1>

    <!-- Galería de FlipLinks -->
    <div class="fliplink-container" data-title="APRENDIZAJEGLOBAL" data-folder="biblioteca"></div>
  </div>

  <!-- Elimina el título residual inyectado dinámicamente por JS -->
  <script>
    setInterval(function() {
      $('.fliplink-container').find('h1, h2, h3, [class*="title"]').not('.main-title').remove();
    }, 300);
  </script>

  <!-- Widget de ChatMaxima -->
  <script>
    window.chatmaximaConfig = { token: '42vw6iznk9' };
  </script>
  <script id="42vw6iznk9" src="https://widget.chatmaxima.com/embed.min.js" defer></script>

</body>
</html>
